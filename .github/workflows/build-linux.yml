name: Build Linux64 standalone (AIB)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit ref to build"
        required: false
        default: "fix/agent-yaw-rotation-unfreeze"

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build StandaloneLinux64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo at ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          lfs: false

      - name: Free disk space
        run: |
          docker system prune -af || true
          df -h

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Linux-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Linux-

      - name: Build StandaloneLinux64
        uses: game-ci/unity-builder@v3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: StandaloneLinux64
          buildName: AnimalAI
          allowDirtyBuild: true

      - name: List build output
        run: |
          ls -la build/StandaloneLinux64/ || true
          du -sh build/StandaloneLinux64/* || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimalAI-StandaloneLinux64
          path: build/StandaloneLinux64
          retention-days: 7
          if-no-files-found: error
